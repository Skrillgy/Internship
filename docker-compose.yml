services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: navalbattle
      POSTGRES_USER: navalbattle
      POSTGRES_PASSWORD: navalbattle

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U navalbattle -d navalbattle"
        ]
      interval: 2s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    environment:
      DATABASE_URL: postgresql+psycopg://navalbattle:navalbattle@db:5432/navalbattle

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"


volumes:
  postgres_data: